[package]
authors = ["guillaumelagrange <lagrange.guillaume.1@gmail.com>"]
license = "MIT OR Apache-2.0"
name = "yolox-burn"
version = "0.1.0"
edition = "2021"

[features]
default = ["pretrained"]
std = []
pretrained = ["burn/network", "std", "dep:dirs"]

[dependencies]
# Note: default-features = false is needed to disable std
burn-import = { git = "https://github.com/torsteingrindvik/burn", branch = "burn-no-leak", default-features = false, features = [
    "pytorch",
] }
burn = { git = "https://github.com/torsteingrindvik/burn", branch = "burn-no-leak", default-features = false }
itertools = { version = "0.12.1", default-features = false, features = [
    "use_alloc",
] }
dirs = { version = "5.0.1", optional = true }
serde = { version = "1.0.192", default-features = false, features = [
    "derive",
    "alloc",
] } # alloc is for no_std, derive is needed

[dev-dependencies]
burn = { git = "https://github.com/torsteingrindvik/burn", branch = "burn-no-leak", features = [
    "ndarray",
    "cuda",
    "wgpu",
] }
image = { version = "0.24.9", features = ["png", "jpeg"] }
